# Builds and checks every supported Minecraft version on every push.
#
# This used to run `./gradlew build` at the repository root, which stopped
# meaning anything when the project was split into one self-contained Gradle
# build per Minecraft version — there is no root build any more. Each version
# is now its own job, driven by the same tools/verify.sh a developer runs
# locally, so a green tick here and a green run on your machine are the same
# check rather than two that drift apart.
#
# The version list lives in tools/versions.tsv and is read into the matrix
# below, so adding a Minecraft version is one line in that file.

name: build
on: [pull_request, push]

jobs:
  core:
    name: core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: core unit tests
        run: ./gradlew -p core test
      - name: upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-test-report
          path: core/build/reports/tests/test/

  matrix:
    name: read version list
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        name: turn tools/versions.tsv into a job matrix
        run: |
          json=$(awk -F'\t' '
            !/^#/ && NF >= 4 {
              printf "%s{\"minecraft\":\"%s\",\"jdk\":\"%s\"}", sep, $1, $2
              sep = ","
            }' tools/versions.tsv)
          echo "versions=[$json]" >> "$GITHUB_OUTPUT"

  version:
    name: ${{ matrix.minecraft }}
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'microsoft'
      - name: make wrappers executable
        run: chmod +x ./gradlew tools/verify.sh versions/*/gradlew
      # --no-core because the core job above already ran those, and running
      # them once per version would only slow the matrix down.
      - name: build and check the jar
        run: ./tools/verify.sh --no-core --only '${{ matrix.minecraft }}'
      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quickrebind-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/
            build/verify/
          if-no-files-found: ignore
