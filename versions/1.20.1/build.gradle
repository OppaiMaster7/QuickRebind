// See versions/1.21.1/build.gradle for why Loom arrives through buildscript and
// why this directory has its own wrapper.
buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}

	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

apply plugin: 'fabric-loom'

version = project.mod_version
group = project.maven_group

base.archivesName = "quickrebind-${project.minecraft_version}"

loom {
	splitEnvironmentSourceSets()

	mods {
		"quickrebind" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets.client.java.srcDir file("$rootDir/../../core/src/main/java")
sourceSets.main.resources.srcDir file("$rootDir/../../core/src/main/resources")

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	// modImplementation, not implementation — otherwise these arrive unmapped.
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("$rootDir/../../LICENSE") {
		rename { "${it}_quickrebind" }
	}
}
