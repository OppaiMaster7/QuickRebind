plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.9.0'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

base.archivesName = "quickrebind-${project.minecraft_version}"

loom {
	splitEnvironmentSourceSets()

	mods {
		"quickrebind" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// The version-independent half of the mod. Shared as a source directory rather
// than a project dependency: every version build compiles the same files, and
// nothing has to be bundled or remapped. It is plain Java 8 with only Gson, so
// it compiles unchanged from 1.8.9 up.
sourceSets.client.java.srcDir file("$rootDir/../../core/src/main/java")
// Translations live there too — every version shows the same strings.
sourceSets.main.resources.srcDir file("$rootDir/../../core/src/main/resources")

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Passing -Pquickrebind.selftest=<file> turns `runClient` into an unattended
// test run: the mod checks itself against this version's real keybinds, writes
// the report to <file> and halts, so the one thing that genuinely needs a
// running game doesn't need a person as well. -Pquickrebind.dir points the
// preset folder at a sandbox so a test can't touch the ones you actually use.
// Driven by tools/verify.sh --selftest.
tasks.matching { it.name == 'runClient' }.configureEach {
	if (project.hasProperty('quickrebind.selftest')) {
		jvmArgs "-Dquickrebind.selftest=${project.property('quickrebind.selftest')}"
	}

	if (project.hasProperty('quickrebind.dir')) {
		jvmArgs "-Dquickrebind.dir=${project.property('quickrebind.dir')}"
	}
}

// Publishing to Modrinth. Never runs as part of `build` — it is the `modrinth`
// task, driven by tools/publish.sh, and it needs MODRINTH_TOKEN in the
// environment. The version number carries the Minecraft version because this
// project ships one jar per version and Modrinth wants them distinguishable.
modrinth {
	token = System.getenv('MODRINTH_TOKEN') ?: ''
	projectId = 'quickrebind'
	versionNumber = "${project.mod_version}+${project.minecraft_version}"
	versionName = "QuickRebind ${project.mod_version} for Minecraft ${project.minecraft_version}"
	versionType = 'release'
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']

	dependencies {
		required.project 'fabric-api'
	}

	def notes = file("$rootDir/../../CHANGELOG.md")
	changelog = notes.exists() ? notes.text : ''
}

// Resolved after evaluation: reading the task while the block above is being
// read fails with "unknown property 'remapJar'".
afterEvaluate {
	// remapJar, not jar: on an obfuscated Minecraft the plain jar still carries
	// Mojang names, and Loom remaps them to the intermediary names the game
	// actually runs with.
	//
	// Except on 26.2, which ships unobfuscated. There is nothing to remap, so
	// that Loom registers no remapJar at all and `jar` is the artifact to ship —
	// which is why this asks rather than assuming.
	modrinth.uploadFile = tasks.findByName('remapJar') ?: tasks.jar
}
