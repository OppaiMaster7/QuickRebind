// Minecraft 1.21.1 is still obfuscated, which the Loom that builds 26.2 no
// longer supports ("Cannot use Mojang mappings in a non-obfuscated
// environment"). So this version pins a contemporary Loom, which in turn needs
// Gradle 8 and JDK 21 — hence the separate wrapper in this directory.
//
// Loom's plugin marker is no longer published for 1.9.2, so it comes in as a
// buildscript classpath dependency rather than through the plugins block.
buildscript {
	repositories {
		maven { url = 'https://maven.fabricmc.net/' }
		mavenCentral()
		gradlePluginPortal()
	}

	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

plugins {
	id 'com.modrinth.minotaur' version '2.9.0'
}

apply plugin: 'fabric-loom'

version = project.mod_version
group = project.maven_group

base.archivesName = "quickrebind-${project.minecraft_version}"

loom {
	splitEnvironmentSourceSets()

	mods {
		"quickrebind" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// See versions/26.2/build.gradle — same shared core, same reasoning.
sourceSets.client.java.srcDir file("$rootDir/../../core/src/main/java")
sourceSets.main.resources.srcDir file("$rootDir/../../core/src/main/resources")

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 26.2's Loom defaults to Mojang mappings; older targets have to ask.
	mappings loom.officialMojangMappings()
	// modImplementation, not implementation: these are published against
	// intermediary and Loom has to remap them first, or every Minecraft type
	// they expose arrives as class_310 and friends.
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("$rootDir/../../LICENSE") {
		rename { "${it}_quickrebind" }
	}
}

// Passing -Pquickrebind.selftest=<file> turns `runClient` into an unattended
// test run: the mod checks itself against this version's real keybinds, writes
// the report to <file> and halts, so the one thing that genuinely needs a
// running game doesn't need a person as well. -Pquickrebind.dir points the
// preset folder at a sandbox so a test can't touch the ones you actually use.
// Driven by tools/verify.sh --selftest.
tasks.matching { it.name == 'runClient' }.configureEach {
	if (project.hasProperty('quickrebind.selftest')) {
		jvmArgs "-Dquickrebind.selftest=${project.property('quickrebind.selftest')}"
	}

	if (project.hasProperty('quickrebind.dir')) {
		jvmArgs "-Dquickrebind.dir=${project.property('quickrebind.dir')}"
	}
}

// Publishing to Modrinth. Never runs as part of `build` — it is the `modrinth`
// task, driven by tools/publish.sh, and it needs MODRINTH_TOKEN in the
// environment. The version number carries the Minecraft version because this
// project ships one jar per version and Modrinth wants them distinguishable.
modrinth {
	token = System.getenv('MODRINTH_TOKEN') ?: ''
	projectId = 'quickrebind'
	versionNumber = "${project.mod_version}+${project.minecraft_version}"
	versionName = "QuickRebind ${project.mod_version} for Minecraft ${project.minecraft_version}"
	versionType = 'release'
	gameVersions = [project.minecraft_version]
	loaders = ['fabric']

	dependencies {
		required.project 'fabric-api'
	}

	def notes = file("$rootDir/../../CHANGELOG.md")
	changelog = notes.exists() ? notes.text : ''
}

// Resolved after evaluation: reading the task while the block above is being
// read fails with "unknown property 'remapJar'".
afterEvaluate {
	// remapJar, not jar: on an obfuscated Minecraft the plain jar still carries
	// Mojang names, and Loom remaps them to the intermediary names the game
	// actually runs with.
	//
	// Except on 26.2, which ships unobfuscated. There is nothing to remap, so
	// that Loom registers no remapJar at all and `jar` is the artifact to ship —
	// which is why this asks rather than assuming.
	modrinth.uploadFile = tasks.findByName('remapJar') ?: tasks.jar
}
